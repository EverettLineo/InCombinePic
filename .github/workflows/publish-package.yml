name: publish-package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只演练打包，不真正发布"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@everettlineo"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "tag 为 ${GITHUB_REF_NAME}，package.json 为 ${pkg}，拒绝发布"
            exit 1
          fi

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 打包内容预检
        run: npm pack --dry-run

      - name: 发布到 GitHub Packages
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
